services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roadman}
      POSTGRES_USER: ${POSTGRES_USER:-roadman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roadman_dev}
    volumes:
      - roadman_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roadman} -d ${POSTGRES_DB:-roadman}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - roadman_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Load project-local credentials as service variables.  In particular,
    # DEEPSEEK_API_KEY must not be interpolated from a stale host environment
    # variable; the ignored .env file is the source of truth for this stack.
    env_file:
      - .env
    environment:
      APP_ENV: docker
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-roadman}:${POSTGRES_PASSWORD:-roadman_dev}@postgres:5432/${POSTGRES_DB:-roadman}
      REDIS_URL: redis://redis:6379/0
      AMAP_WEBSERVICE_KEY: ${AMAP_WEBSERVICE_KEY:-}
      OPENTRIPMAP_API_KEY: ${OPENTRIPMAP_API_KEY:-}
      FLYAI_API_KEY: ${FLYAI_API_KEY:-}
      TRAIN_FALLBACK_URL: ${TRAIN_FALLBACK_URL:-https://api.lolimi.cn/API/hc/api}
      MCP_12306_URL: ${MCP_12306_URL:-}
      FLIGHT_FALLBACK_URL: ${FLIGHT_FALLBACK_URL:-https://open.6api.net/flight/getTicket}
      FLIGHT_FALLBACK_API_KEY: ${FLIGHT_FALLBACK_API_KEY:-}
      OIL_API_URL: ${OIL_API_URL:-https://www.mxnzp.com/api/oil/search}
      OIL_APP_ID: ${OIL_APP_ID:-}
      OIL_APP_SECRET: ${OIL_APP_SECRET:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/chat/completions}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-low}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-false}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-32768}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-180}
      # Deprecated aliases are passed through only for older local fixtures;
      # application requests always use the DeepSeek endpoint above.
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      # Docker Desktop cannot use a host-only 127.0.0.1 proxy address. Set
      # ROADMAN_HTTP_PROXY to the host-reachable proxy URL when one is used
      # (for example http://host.docker.internal:7890).
      HTTP_PROXY: ${ROADMAN_HTTP_PROXY:-}
      HTTPS_PROXY: ${ROADMAN_HTTP_PROXY:-}
      NO_PROXY: ${ROADMAN_NO_PROXY:-localhost,127.0.0.1,postgres,redis}
      NODE_USE_ENV_PROXY: "1"
      ENABLE_ROUTE_ELEVATION: "true"
      LOAD_LOCAL_SKILL_CREDENTIALS: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      UPLOAD_DIR: /app/data/uploads
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-30}
    ports:
      # Expose the API on loopback for local tooling and Playwright. The
      # frontend still reaches it internally through the Docker network.
      - "127.0.0.1:8000:8000"
    volumes:
      - roadman_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 8s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["arq", "app.workers.main.WorkerSettings"]
    # Keep worker and API on the exact same project-local DeepSeek credential.
    env_file:
      - .env
    environment:
      APP_ENV: docker
      TZ: Asia/Shanghai
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-roadman}:${POSTGRES_PASSWORD:-roadman_dev}@postgres:5432/${POSTGRES_DB:-roadman}
      REDIS_URL: redis://redis:6379/0
      AMAP_WEBSERVICE_KEY: ${AMAP_WEBSERVICE_KEY:-}
      OPENTRIPMAP_API_KEY: ${OPENTRIPMAP_API_KEY:-}
      FLYAI_API_KEY: ${FLYAI_API_KEY:-}
      TRAIN_FALLBACK_URL: ${TRAIN_FALLBACK_URL:-https://api.lolimi.cn/API/hc/api}
      MCP_12306_URL: ${MCP_12306_URL:-}
      FLIGHT_FALLBACK_URL: ${FLIGHT_FALLBACK_URL:-https://open.6api.net/flight/getTicket}
      FLIGHT_FALLBACK_API_KEY: ${FLIGHT_FALLBACK_API_KEY:-}
      OIL_API_URL: ${OIL_API_URL:-https://www.mxnzp.com/api/oil/search}
      OIL_APP_ID: ${OIL_APP_ID:-}
      OIL_APP_SECRET: ${OIL_APP_SECRET:-}
      DEEPSEEK_API_URL: ${DEEPSEEK_API_URL:-https://api.deepseek.com/chat/completions}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_REASONING_EFFORT: ${DEEPSEEK_REASONING_EFFORT:-low}
      DEEPSEEK_THINKING: ${DEEPSEEK_THINKING:-false}
      DEEPSEEK_MAX_TOKENS: ${DEEPSEEK_MAX_TOKENS:-32768}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-180}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      HTTP_PROXY: ${ROADMAN_HTTP_PROXY:-}
      HTTPS_PROXY: ${ROADMAN_HTTP_PROXY:-}
      NO_PROXY: ${ROADMAN_NO_PROXY:-localhost,127.0.0.1,postgres,redis}
      NODE_USE_ENV_PROXY: "1"
      ENABLE_ROUTE_ELEVATION: "true"
      LOAD_LOCAL_SKILL_CREDENTIALS: "false"
      UPLOAD_DIR: /app/data/uploads
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-30}
    volumes:
      - roadman_uploads:/app/data/uploads
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_AMAP_JSAPI_KEY: ${VITE_AMAP_JSAPI_KEY:-}
        VITE_AMAP_SECURITY_JS_CODE: ${VITE_AMAP_SECURITY_JS_CODE:-}
        VITE_AMAP_SERVICE_HOST: ${VITE_AMAP_SERVICE_HOST:-}
        HTTP_PROXY: ${ROADMAN_HTTP_PROXY:-}
        HTTPS_PROXY: ${ROADMAN_HTTP_PROXY:-}
        NO_PROXY: ${ROADMAN_NO_PROXY:-localhost,127.0.0.1}
    ports:
      # Bind the unified web entrypoint on every host interface so other
      # devices on the same LAN can open http://<host-ip>:8080.
      - "0.0.0.0:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  roadman_postgres:
  roadman_redis:
  roadman_uploads:
