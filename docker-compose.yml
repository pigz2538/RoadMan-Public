services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roadman
      POSTGRES_USER: roadman
      POSTGRES_PASSWORD: roadman_dev
    volumes:
      - roadman_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadman -d roadman"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - roadman_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://roadman:roadman_dev@postgres:5432/roadman
      REDIS_URL: redis://redis:6379/0
      AMAP_WEBSERVICE_KEY: ${AMAP_WEBSERVICE_KEY:-}
      LOAD_LOCAL_SKILL_CREDENTIALS: "false"
      CORS_ORIGINS: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 8s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  roadman_postgres:
  roadman_redis:
