services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: roadman
      POSTGRES_USER: roadman
      POSTGRES_PASSWORD: roadman_dev
    volumes:
      - roadman_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadman -d roadman"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - roadman_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://roadman:roadman_dev@postgres:5432/roadman
      REDIS_URL: redis://redis:6379/0
      AMAP_WEBSERVICE_KEY: ${AMAP_WEBSERVICE_KEY:-}
      OPENTRIPMAP_API_KEY: ${OPENTRIPMAP_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-v4-flash:0731-cloud}
      # Docker Desktop cannot use a host-only 127.0.0.1 proxy address. Set
      # ROADMAN_HTTP_PROXY to the host-reachable proxy URL when one is used
      # (for example http://host.docker.internal:7890).
      HTTP_PROXY: ${ROADMAN_HTTP_PROXY:-}
      HTTPS_PROXY: ${ROADMAN_HTTP_PROXY:-}
      NO_PROXY: ${ROADMAN_NO_PROXY:-localhost,127.0.0.1,postgres,redis}
      NODE_USE_ENV_PROXY: "1"
      ENABLE_ROUTE_ELEVATION: "true"
      LOAD_LOCAL_SKILL_CREDENTIALS: "true"
      CORS_ORIGINS: http://localhost:8080
      UPLOAD_DIR: /app/data/uploads
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-30}
    volumes:
      - roadman_uploads:/app/data/uploads
      - ./Skills/amap-lbs/apipkey.txt:/Skills/amap-lbs/apipkey.txt:ro
      - ./Skills/opentripmap/apikey.txt:/Skills/opentripmap/apikey.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 8s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["arq", "app.workers.main.WorkerSettings"]
    environment:
      APP_ENV: docker
      DATABASE_URL: postgresql+asyncpg://roadman:roadman_dev@postgres:5432/roadman
      REDIS_URL: redis://redis:6379/0
      AMAP_WEBSERVICE_KEY: ${AMAP_WEBSERVICE_KEY:-}
      OPENTRIPMAP_API_KEY: ${OPENTRIPMAP_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-v4-flash:0731-cloud}
      HTTP_PROXY: ${ROADMAN_HTTP_PROXY:-}
      HTTPS_PROXY: ${ROADMAN_HTTP_PROXY:-}
      NO_PROXY: ${ROADMAN_NO_PROXY:-localhost,127.0.0.1,postgres,redis}
      NODE_USE_ENV_PROXY: "1"
      ENABLE_ROUTE_ELEVATION: "true"
      LOAD_LOCAL_SKILL_CREDENTIALS: "true"
      UPLOAD_DIR: /app/data/uploads
      FILE_RETENTION_DAYS: ${FILE_RETENTION_DAYS:-30}
    volumes:
      - roadman_uploads:/app/data/uploads
      - ./Skills/amap-lbs/apipkey.txt:/Skills/amap-lbs/apipkey.txt:ro
      - ./Skills/opentripmap/apikey.txt:/Skills/opentripmap/apikey.txt:ro
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # Bind the unified web entrypoint on every host interface so other
      # devices on the same LAN can open http://<host-ip>:8080.
      - "0.0.0.0:8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  roadman_postgres:
  roadman_redis:
  roadman_uploads:
